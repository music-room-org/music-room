name: Build

on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-expo-mobile:
    name: CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check (npx tsc --noEmit)
        run: npx tsc --noEmit

      - name: Expo JS Bundle Export (npx expo export)
        run: npx expo export