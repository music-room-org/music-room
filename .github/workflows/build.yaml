name: Build

on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  expo-build:
    name: Expo Mobile Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check (npx tsc --noEmit)
        run: npx tsc --noEmit

      - name: Expo JS Bundle Export (npx expo export)
        run: npx expo export

  nest-build:
    name: NestJS Backend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Check (npx tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build NestJS App (npm run build)
        run: npm run build